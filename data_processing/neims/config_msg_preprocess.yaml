# neims_preprocessing configuration  –  MSG dataset
# Run with:  python neims_preprocessing.py config_msg_preprocess.yaml
#
# Prerequisites – generate the per-split MGFs first, then combine:
#   python neims_output_to_mgf.py data_processing/neims/config_msg_train_original.yaml
#   python neims_output_to_mgf.py data_processing/neims/config_msg_val_original.yaml
#   python neims_output_to_mgf.py data_processing/neims/config_msg_test_original.yaml
#   cat data/neims/msg/mist_inputs/msg_train_spectra.mgf \
#       data/neims/msg/mist_inputs/msg_val_spectra.mgf   \
#       data/neims/msg/mist_inputs/msg_test_spectra.mgf  \
#       > data/neims/msg/mist_inputs/spectra_combined.mgf

mgf_file:     data/neims/msg/mist_inputs/spectra_combined.mgf
dataset_name: msg
output_dir:   data/neims/msg/mist_inputs

split_mode:       predefined
train_id_prefix:  msg-train
val_id_prefix:    msg-val
test_id_prefix:   msg-test

num_workers:      8
mass_diff_thresh: 20
max_formulae:     50

log_level: INFO
