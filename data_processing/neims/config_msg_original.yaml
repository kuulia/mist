# neims_output_to_mgf configuration  –  gecko original molecules
# Run with:  python neims_output_to_mgf.py config_gecko_original.yaml

spectra_dir: data/neims/gecko_EIMS_spectra/gecko/NEIMS/original  # directory containing the NEIMS output folders e.g. "000000"
smiles_csv:  data/neims/gecko_EIMS_spectra/processed/SMILES_gecko_corr_nitrate.csv # CSV file containing the SMILES strings
output:      data/neims/gecko_EIMS_spectra/mist_inputs/gecko_spectra.mgf # output MGF file

smiles_col: null      # auto-detects 'SMILES' column
id_prefix:  gecko     # name of the dataset, used as prefix for spectrum titles in the MGF file
min_peaks:  5         # minimum number of peaks required for a spectrum to be included in the output (sanity check for EI-MS)
log_level:  INFO
